        <stop offset="0%" stop-color="#ffee88"/>
        <stop offset="50%" stop-color="#ffd700"/>
        <stop offset="100%" stop-color="#c99700"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="24" fill="#181324"/>
    <!-- Chain -->
    <path d="M50 12 L50 48" stroke="url(#gTikka)" stroke-width="3" stroke-dasharray="2 3" stroke-linecap="round"/>
    <circle cx="50" cy="14" r="4" fill="url(#gTikka)"/>
    <!-- Center Pendant -->
    <circle cx="50" cy="60" r="16" fill="none" stroke="url(#gTikka)" stroke-width="3.5"/>
    <circle cx="50" cy="60" r="9" fill="#e63946" stroke="url(#gTikka)" stroke-width="1.5"/>
    <circle cx="50" cy="60" r="4" fill="#ffffff"/>
    <!-- Hanging pearls -->
    <circle cx="50" cy="82" r="3.5" fill="#ffffff" stroke="url(#gTikka)" stroke-width="1"/>
    <circle cx="42" cy="79" r="2.5" fill="#ffffff"/>
    <circle cx="58" cy="79" r="2.5" fill="#ffffff"/>
  </svg>