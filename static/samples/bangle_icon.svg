<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="goldBangle" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff3a8"/>
        <stop offset="50%" stop-color="#e5aa10"/>
        <stop offset="100%" stop-color="#996b00"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="24" fill="#1c1410"/>
    <ellipse cx="50" cy="50" rx="34" ry="22" fill="none" stroke="url(#goldBangle)" stroke-width="9"/>
    <ellipse cx="50" cy="50" rx="34" ry="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 5"/>
    <!-- Ruby studs on bangle -->
    <circle cx="24" cy="48" r="3.5" fill="#e63946" stroke="#ffd700" stroke-width="1"/>
    <circle cx="76" cy="48" r="3.5" fill="#e63946" stroke="#ffd700" stroke-width="1"/>
    <circle cx="50" cy="72" r="3.5" fill="#00d4ff" stroke="#ffd700" stroke-width="1"/>
